name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история, чтобы найти самый свежий zip

      # Берём zip, который был закоммичен последним, и распаковываем в _src.
      # Если zip нет - считаем, что исходники лежат в корне репозитория.
      - name: Find and unpack newest source zip
        id: src
        run: |
          set -e
          newest=""
          best=0
          while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$best" ]; then best="${t:-0}"; newest="$f"; fi
          done
